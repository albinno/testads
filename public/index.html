<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Monetag Test</title>

    <!-- ======================================================
         TELEGRAM MINI APP SDK
         ====================================================== -->

    <script src="https://telegram.org/js/telegram-web-app.js"></script>


    <!-- ======================================================
         MONETAG SDK
         
         IMPORTANT:
         Paste the EXACT Monetag SDK tag generated by
         Monetag Dashboard here.
         
         Do NOT invent the script URL.
         ====================================================== -->

    <!--
    PASTE YOUR MONETAG SDK TAG HERE
    -->
    <script src="https://libtl.com/sdk.js" data-zone="11576997" data-sdk="show_11576997"></script>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #0f1117;
            color: #ffffff;
        }

        body {
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 520px;

            margin: 0 auto;

            padding:
                24px
                18px
                40px;
        }

        .header {
            margin-bottom: 24px;
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 14px;
            line-height: 1.5;
        }

        .card {
            background: #181b23;
            border: 1px solid #272b35;
            border-radius: 18px;

            padding: 20px;

            margin-bottom: 16px;
        }

        .balance-label {
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .balance {
            font-size: 36px;
            font-weight: 800;
        }

        .button {
            width: 100%;

            border: 0;
            border-radius: 14px;

            padding: 16px;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            background: #ffffff;
            color: #111111;

            transition:
                transform 0.1s ease,
                opacity 0.2s ease;
        }

        .button:active {
            transform: scale(0.98);
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 16px;

            padding: 14px;

            border-radius: 12px;

            background: #111318;

            color: #9ca3af;

            font-size: 13px;

            line-height: 1.5;

            white-space: pre-wrap;
        }

        .success {
            color: #86efac;
        }

        .error {
            color: #fca5a5;
        }

        .info {
            color: #93c5fd;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="title">
            🎬 Monetag Test
        </div>

        <div class="subtitle">
            Rewarded Interstitial test for Telegram Mini Apps.
        </div>

    </div>


    <!-- ======================================================
         BALANCE
         ====================================================== -->

    <div class="card">

        <div class="balance-label">
            Test Balance
        </div>

        <div
            id="balance"
            class="balance"
        >
            0
        </div>

    </div>


    <!-- ======================================================
         AD
         ====================================================== -->

    <div class="card">

        <button
            id="watchAdButton"
            class="button"
        >
            🎬 Watch Ad +100
        </button>

        <div
            id="status"
            class="status info"
        >
            Initializing...
        </div>

    </div>

</div>


<script>

    // ========================================================
    // TELEGRAM
    // ========================================================

    const tg = window.Telegram?.WebApp;

    if (tg) {

        tg.ready();

        tg.expand();

    }


    // ========================================================
    // CONFIG
    // ========================================================

    const REWARD_POINTS = 100;


    // ========================================================
    // ELEMENTS
    // ========================================================

    const watchAdButton =
        document.getElementById("watchAdButton");

    const statusElement =
        document.getElementById("status");

    const balanceElement =
        document.getElementById("balance");


    // ========================================================
    // STATUS
    // ========================================================

    function setStatus(
        message,
        type = "info"
    ) {

        statusElement.textContent = message;

        statusElement.className =
            `status ${type}`;

    }


    // ========================================================
    // TELEGRAM USER
    // ========================================================

    function getTelegramUserId() {

        const user =
            tg?.initDataUnsafe?.user;

        if (!user?.id) {

            return null;

        }

        return String(user.id);

    }


    // ========================================================
    // BALANCE
    // ========================================================

    async function loadBalance() {

        const telegramId =
            getTelegramUserId();

        if (!telegramId) {

            setStatus(
                "Open this page inside Telegram as a Mini App.",
                "error"
            );

            return;

        }

        try {

            const response =
                await fetch(
                    `/api/balance?telegramId=${encodeURIComponent(telegramId)}`
                );

            const data =
                await response.json();

            if (!data.ok) {

                throw new Error(
                    data.error || "Failed to load balance"
                );

            }

            balanceElement.textContent =
                data.points;

        } catch (error) {

            console.error(error);

            setStatus(
                `Failed to load balance:\n${error.message}`,
                "error"
            );

        }

    }


    // ========================================================
    // CREATE AD SESSION
    // ========================================================

    async function createAdSession() {

        const telegramId =
            getTelegramUserId();

        if (!telegramId) {

            throw new Error(
                "Telegram user ID unavailable. Open the app from Telegram."
            );

        }

        const response =
            await fetch(
                "/api/ad-session",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        telegramId
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok || !data.ok) {

            throw new Error(
                data.error ||
                "Could not create ad session"
            );

        }

        return data.ymid;

    }


    // ========================================================
    // SHOW MONETAG AD
    // ========================================================

    async function watchAd() {

        watchAdButton.disabled = true;

        setStatus(
            "Creating ad session...",
            "info"
        );

        try {

            // ------------------------------------------------
            // Create our own unique session first.
            // ------------------------------------------------

            const ymid =
                await createAdSession();

            console.log(
                "Monetag ymid:",
                ymid
            );


            // ------------------------------------------------
            // IMPORTANT:
            //
            // Monetag gives you a function named:
            //
            // show_XXXXXXXX()
            //
            // where XXXXXXXX is your MAIN ZONE ID.
            //
            // Example:
            //
            // show_12345678({
            //     ymid,
            //     requestVar: "watch_ad"
            // })
            //
            // ------------------------------------------------

            
            // ------------------------------------------------
            // Verify Monetag SDK
            // ------------------------------------------------

            if (
                typeof window.show_11576997 !==
                "function"
            ) {
                throw new Error(
                    "Monetag SDK failed to load. " +
                    "show_11576997() is unavailable."
                );
            }

            setStatus(
                "Loading advertisement...",
                "info"
            );

            // ------------------------------------------------
            // Show Monetag Rewarded Interstitial
            // ------------------------------------------------

            await window.show_11576997({ ymid, requestVar: "watch_ad" });

            // ------------------------------------------------
            // Monetag says the rewarded ad completed
            // ------------------------------------------------

            console.log(
                "Monetag Rewarded Interstitial completed."
            );

            setStatus(
                "✅ Ad completed.\n" +
                "Waiting for backend reward confirmation...",
                "success"
            );

            // Give the postback a moment to arrive.
            setTimeout(
                loadBalance,
                2000
            );


        } catch (error) {

            console.error(
                "Monetag ad error:",
                error
            );

            setStatus(
                `❌ Ad failed or was skipped.\n\n${error.message}`,
                "error"
            );

        } finally {

            watchAdButton.disabled = false;

        }

    }


    // ========================================================
    // BUTTON
    // ========================================================

    watchAdButton.addEventListener(
        "click",
        watchAd
    );


    // ========================================================
    // INITIALIZE
    // ========================================================

    window.addEventListener(
        "load",
        async () => {

            setStatus(
                "Ready.",
                "info"
            );

            await loadBalance();

        }
    );

</script>

</body>
</html>
